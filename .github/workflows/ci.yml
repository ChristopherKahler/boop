name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
        working-directory: server/web
      - run: npm run check
        working-directory: server/web
      - run: npx vitest run
        working-directory: server/web
      - run: npm run build
        working-directory: server/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: server/internal/web/dist

  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/web/dist
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
      - run: CGO_ENABLED=0 go build -o /tmp/boop ./cmd/boop
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          load: true
          tags: boop:ci
      # Run it the way Railway does: no BOOP_PORT, an injected PORT, no
      # credentials (so it must print a setup code and stay locked).
      - name: Run the image and check it
        run: |
          docker run -d --name boop -e PORT=9090 -p 9090:9090 boop:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9090/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:9090/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/api/v1/alerts)" = 401
          docker logs boop 2>&1 | grep -q auth.setup_required
          docker inspect --format '{{.State.Health.Status}}' boop || true
