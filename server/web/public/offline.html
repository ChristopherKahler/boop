<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub unreachable</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FDFDFE; color: #1A1B25; font: 15px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { max-width: 340px; padding: 24px; text-align: center; }
      .mark { width: 44px; height: 44px; border-radius: 12px; background: #7C83E8; margin: 0 auto 18px; position: relative; }
      .mark::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: #FDFDFE; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { margin: 0 0 18px; color: #5B5E70; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 9px 18px; background: #7C83E8; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1>Can't reach the hub</h1>
      <p>The phone is offline, or the computer running the hub is asleep or off the network. Notifications already on your phone still open once it is back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
